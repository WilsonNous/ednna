name: Build and deploy EDNNA to Azure

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate dependencies
        run: pip check

      - name: Lint
        run: ruff check ednna tests config.py

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6CDADE4E9BD478EA4937D94BCB2B208 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AACC0FAA254247559C7884F24FF83801 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_826F5706600640C9ADBB17335EC31AD1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ednna
          slot-name: Production
          package: .

  activate-production:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[activate-production]')
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6CDADE4E9BD478EA4937D94BCB2B208 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_AACC0FAA254247559C7884F24FF83801 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_826F5706600640C9ADBB17335EC31AD1 }}

      - name: Load and validate Azure App Settings
        shell: bash
        run: |
          set -euo pipefail

          resource_group="$(az webapp list --query "[?name=='ednna'].resourceGroup | [0]" -o tsv)"
          if [ -z "$resource_group" ]; then
            echo "Could not resolve Azure resource group for app 'ednna'."
            exit 1
          fi
          echo "AZURE_RESOURCE_GROUP=$resource_group" >> "$GITHUB_ENV"

          settings_file="$(mktemp)"
          az webapp config appsettings list \
            --resource-group "$resource_group" \
            --name ednna \
            -o json > "$settings_file"

          read_setting() {
            jq -r --arg name "$1" '.[] | select(.name == $name) | .value // empty' "$settings_file" | head -n 1
          }

          export_setting() {
            name="$1"
            value="$(read_setting "$name")"
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          }

          required=(
            SECRET_KEY ADMIN_PASSWORD
            DB_HOST DB_USER DB_PASSWORD DB_NAME
          )
          for name in "${required[@]}"; do
            value="$(read_setting "$name")"
            if [ -z "$value" ]; then
              echo "Missing required Azure App Setting: $name"
              exit 1
            fi
            echo "::add-mask::$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done

          export_setting DB_PORT
          if [ -z "$(read_setting DB_PORT)" ]; then
            echo "DB_PORT=3306" >> "$GITHUB_ENV"
          fi

          optional=(
            EDDY_BASE_URL EDDY_API_TOKEN EDDY_TIMEOUT_SECONDS
            OIDC_ISSUER OIDC_AUDIENCE OIDC_JWKS_URL
            OIDC_TENANT_CLAIM OIDC_USER_CLAIM OIDC_SERVICE_CLAIM
            OIDC_ROLES_CLAIM OIDC_PERMISSIONS_CLAIM
            SERVICEBUS_NAMESPACE SERVICEBUS_TOPIC SERVICEBUS_SUBSCRIPTION
            SERVICEBUS_MANAGED_IDENTITY_CLIENT_ID
          )
          for name in "${optional[@]}"; do
            export_setting "$name"
          done

          oidc_ready=false
          if [ -n "$(read_setting OIDC_ISSUER)" ] \
             && [ -n "$(read_setting OIDC_AUDIENCE)" ] \
             && [ -n "$(read_setting OIDC_JWKS_URL)" ]; then
            oidc_ready=true
          fi

          eddy_ready=false
          if [ -n "$(read_setting EDDY_BASE_URL)" ] \
             && [ -n "$(read_setting EDDY_API_TOKEN)" ]; then
            eddy_ready=true
          fi

          servicebus_ready=false
          if [ -n "$(read_setting SERVICEBUS_NAMESPACE)" ] \
             && [ -n "$(read_setting SERVICEBUS_TOPIC)" ]; then
            servicebus_ready=true
          fi

          echo "OIDC_READY=$oidc_ready" >> "$GITHUB_ENV"
          echo "EDDY_READY=$eddy_ready" >> "$GITHUB_ENV"
          echo "SERVICEBUS_READY=$servicebus_ready" >> "$GITHUB_ENV"

          echo "Azure pre-flight:"
          echo "- base application: ready"
          echo "- database settings: ready"
          echo "- OIDC prerequisites: $oidc_ready"
          echo "- EDDY prerequisites: $eddy_ready"
          echo "- Service Bus prerequisites: $servicebus_ready"

      - name: Apply pending orchestration migrations
        run: python -m ednna.infrastructure.apply_migrations

      - name: Activate safe production capabilities
        shell: bash
        run: |
          set -euo pipefail

          approval=false
          events=false
          eddy=false
          multiagent=false
          actions=false

          if [ "$OIDC_READY" = "true" ]; then
            approval=true
            events=true
          fi

          if [ "$EDDY_READY" = "true" ]; then
            eddy=true
          fi

          if [ "$OIDC_READY" = "true" ] && [ "$EDDY_READY" = "true" ]; then
            multiagent=true
            actions=true
          fi

          az webapp config appsettings set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ednna \
            --settings \
              "EDDY_ENABLED=$eddy" \
              "APPROVAL_API_ENABLED=$approval" \
              "EVENT_INGRESS_API_ENABLED=$events" \
              "MULTIAGENT_QUERY_API_ENABLED=$multiagent" \
              "ACTION_API_ENABLED=$actions" \
              "ACTION_EXECUTION_MODE=dry_run" \
              "SERVICEBUS_OUTBOX_ENABLED=false" \
              "SERVICEBUS_CONSUMER_ENABLED=false" \
              "SPECIALIST_HANDSHAKE_ENFORCED=false" \
              "SPECIALIST_AVAILABILITY_DURABLE=false" \
              "SPECIALIST_HEALTH_WORKER_ENABLED=false" \
            --output none

          echo "EDDY_ENABLED=$eddy" >> "$GITHUB_ENV"
          echo "APPROVAL_API_ENABLED=$approval" >> "$GITHUB_ENV"
          echo "EVENT_INGRESS_API_ENABLED=$events" >> "$GITHUB_ENV"
          echo "MULTIAGENT_QUERY_API_ENABLED=$multiagent" >> "$GITHUB_ENV"
          echo "ACTION_API_ENABLED=$actions" >> "$GITHUB_ENV"
          echo "ACTION_EXECUTION_MODE=dry_run" >> "$GITHUB_ENV"
          echo "SERVICEBUS_OUTBOX_ENABLED=false" >> "$GITHUB_ENV"
          echo "SERVICEBUS_CONSUMER_ENABLED=false" >> "$GITHUB_ENV"
          echo "SPECIALIST_HANDSHAKE_ENFORCED=false" >> "$GITHUB_ENV"
          echo "SPECIALIST_AVAILABILITY_DURABLE=false" >> "$GITHUB_ENV"
          echo "SPECIALIST_HEALTH_WORKER_ENABLED=false" >> "$GITHUB_ENV"

          echo "Activated:"
          echo "- EDDY: $eddy"
          echo "- approval API: $approval"
          echo "- event ingress: $events"
          echo "- multiagent query: $multiagent"
          echo "- ACTION API: $actions (dry_run)"
          echo "- Service Bus workers: false"

      - name: Run release gate
        run: python -m ednna.operations.release_gate

      - name: Configure composed application startup
        run: |
          az webapp config set \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ednna \
            --startup-file "gunicorn --bind=0.0.0.0 --timeout 600 application:app" \
            --output none

      - name: Restart Azure App Service
        run: |
          az webapp restart \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ednna

      - name: Verify production readiness endpoint
        shell: bash
        run: |
          set -euo pipefail

          host="$(az webapp show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name ednna \
            --query defaultHostName -o tsv)"

          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 \
              "https://$host/api/readiness" > readiness.json; then
              cat readiness.json
              exit 0
            fi
            sleep 10
          done

          echo "Production readiness endpoint did not become healthy."
          exit 1
